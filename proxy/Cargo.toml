[package]
name = "masq-proxy"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
description = "masqueradarr durable video data plane — HLS/TS proxy sidecar (control plane stays in Node)"
license = "MIT"
publish = false

# The single sidecar binary. Node (server/src/proxy/sidecar.ts) spawns + supervises it on loopback; the
# reverse-proxy (P1) and, later, the public edge (P3) point at it. See
# .claude/plans/use-ultrathink-durable-vectorized-comet.md.
[[bin]]
name = "masq-proxy"
path = "src/main.rs"

[dependencies]
# Web framework + async runtime. P0 uses only the health surface; P1 adds reqwest + m3u8-rs for the
# fetch → manifest-rewrite → segment-pipe data path.
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
serde_json = "1"

# A lean, durable release binary (this runs 24/7 on modest hardware — a Pi / small VPS).
[profile.release]
opt-level = 3
lto = "thin"
strip = true
