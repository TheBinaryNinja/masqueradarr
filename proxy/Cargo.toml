[package]
name = "masq-proxy"
version = "0.1.0"
edition = "2021"
# The floor the LOCKED tree actually needs: hickory-resolver/-proto/-net 0.26 declare 1.88 (rand 0.10 and
# getrandom 0.4 under them, 1.85; the icu_* 2.2 crates, 1.86). Cargo refuses a toolchain below any of them, so a
# lower value here would only promise what `cargo build --locked` cannot keep. Both Rust images the Dockerfiles
# build on (rust:1-bookworm, rust:1-bullseye) and CI's stable toolchain are well past it.
rust-version = "1.88"
description = "masqueradarr durable video data plane — HLS/TS proxy sidecar (control plane stays in Node)"
license = "MIT"
publish = false

# The single sidecar binary. Node (server/src/proxy/sidecar.ts) spawns + supervises it on loopback; the
# reverse-proxy (P1) and, later, the public edge (P3) point at it. See
# .claude/plans/use-ultrathink-durable-vectorized-comet.md.
[[bin]]
name = "masq-proxy"
path = "src/main.rs"

[dependencies]
# Web framework + async runtime (the client-facing surface + graceful shutdown).
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time", "io-util"] }
# EDGE-3: the public-edge reverse proxy. The plain-HTTP leg reuses reqwest; the WebSocket-upgrade leg needs
# hyper's low-level client (dial Node, forward the Upgrade, splice the two `Upgraded` IOs). All three are
# already in the tree transitively via axum 0.7 — declaring them direct adds no new fetch.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
# Stream adapters: ReceiverStream (drain a bounded mpsc buffer into an axum Body) + StreamExt::next (drive
# reqwest's bytes_stream in the RSL segment pump / DST TS concat). Already in the tree via tokio/reqwest.
tokio-stream = "0.1"
# HTTP client for upstream fetches + the Node resolve-seam / telemetry calls. rustls (not native-tls) so the
# binary has no system OpenSSL dependency; `stream` gives bytes_stream() for zero-copy segment piping.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip", "http2", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
percent-encoding = "2"
# Name the byte-buffer type for the RSL segment pump channel (already in the tree via axum/reqwest).
bytes = "1"
# AES-128-CBC decryption of encrypted HLS (#EXT-X-KEY:METHOD=AES-128) so the DST raw-TS producer can decrypt
# each segment server-side and concatenate it into the continuous video/mp2t stream (e.g. Pluto's ts_aes
# channels). Pure-Rust RustCrypto — no system OpenSSL, matching the reqwest rustls choice above; `aes` uses
# hardware AES-NI where present. `cbc` needs `alloc` for decrypt_padded_vec_mut; `hex` parses the KEY IV=0x… .
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hex = "0.4"
# The Settings nameservers, in the data plane (dns.rs): a custom reqwest resolver that asks the operator's
# servers first and falls back to the OS resolver. Plain DNS over UDP/TCP only — default features off, which
# drops the system-config reader (the servers come from Settings, never /etc/resolv.conf) and every
# DoT/DoH/DoQ transport, so the tree gains no TLS stack of its own and still no system OpenSSL.
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio"] }

# A lean, durable release binary (this runs 24/7 on modest hardware — a Pi / small VPS).
[profile.release]
opt-level = 3
lto = "thin"
strip = true
