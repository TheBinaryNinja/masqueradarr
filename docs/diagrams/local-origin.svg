rient="auto"><path d="M0.5,0.8 L8.4,4.5 L0.5,8.2 L2.4,4.5 Z" fill="#9AA5AA"/></marker><marker id="b-ash" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto"><path d="M8.5,0.8 L0.6,4.5 L8.5,8.2 L6.6,4.5 Z" fill="#9AA5AA"/></marker><marker id="a-mist" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0.5,0.8 L8.4,4.5 L0.5,8.2 L2.4,4.5 Z" fill="#E9EDEE"/></marker><marker id="b-mist" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto"><path d="M8.5,0.8 L0.6,4.5 L8.5,8.2 L6.6,4.5 Z" fill="#E9EDEE"/></marker>
