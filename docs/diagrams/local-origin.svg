<rect x="0.5" y="0.5" width="939" height="699" rx="13.5" fill="none" stroke="#1A2124" stroke-width="1"/>
<g><rect x="32" y="30" width="3" height="18" rx="1.5" fill="#48D7FE"/><text x="45" y="44" font-family="'Space Grotesk','Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="600" fill="#E9EDEE" letter-spacing="0.2">Local origin — one ingest, two renderers</text><text x="908" y="44" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.8" font-weight="400" fill="#5E696E" text-anchor="end">originEnabled · Side-1 iop / Side-2 oop</text><line x1="32" y1="60" x2="908" y2="60" stroke="#232B2F" stroke-width="1"/></g><g><rect x="24" y="110" width="296" height="400" rx="12" fill="#0F1416" stroke="#232B2F" stroke-width="1" stroke-dasharray="5 4"/><rect x="40" y="102" width="170.26" height="16" rx="5" fill="#0C0F11" stroke="#2A3236" stroke-width="1"/><text x="125.13" y="113.4" font-family="'Space Grotesk','Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9" font-weight="600" fill="#F7B83D" text-anchor="middle" letter-spacing="1.3">SIDE-1 · ingest · iop</text></g><g><rect x="620" y="110" width="296" height="400" rx="12" fill="#0F1416" stroke="#232B2F" stroke-width="1" stroke-dasharray="5 4"/><rect x="636" y="102" width="163.2" height="16" rx="5" fill="#0C0F11" stroke="#2A3236" stroke-width="1"/><text x="717.6" y="113.4" font-family="'Space Grotesk','Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9" font-weight="600" fill="#48D7FE" text-anchor="middle" letter-spacing="1.3">SIDE-2 · serve · oop</text></g><path d="M 172 232 L 172 251" fill="none" stroke="#F7B83D" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a-amber)" opacity="0.9"/><path d="M 172 334 L 172 353" fill="none" stroke="#F7B83D" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a-amber)" opacity="0.9"/><path d="M 172 436 L 172 461 Q 172 470 181 470 L 461 470 Q 470 470 470 461 L 470 393" fill="none" stroke="#F7B83D" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a-amber)" opacity="0.9"/><path d="M 592 325 L 598 325 Q 604 325 604 319 L 604 200 Q 604 191 613 191 L 634 191" fill="none" stroke="#5FD37F" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a-green)" opacity="0.9"/><path d="M 592 365 L 611 365 Q 620 365 620 356 L 620 310 Q 620 303 627 303 L 634 303" fill="none" stroke="#5FD37F" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a-green)" opacity="0.9"/><path d="M 766 344 L 766 398" fill="none" stroke="#48D7FE" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a-teal)" opacity="0.9"/><path d="M 900 191 L 908 191 Q 916 191 916 199 L 916 434 Q 916 441 909 441 L 902 441" fill="none" stroke="#48D7FE" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a-teal)" opacity="0.9"/><g><rect x="40" y="150" width="264" height="82" rx="9" fill="#171D20" stroke="#2A3236" stroke-width="1"/><rect x="41.5" y="159" width="3" height="64" rx="1.5" fill="#5E696E"/><text x="58" y="173.4" font-family="'Space Grotesk','Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.6" font-weight="600" fill="#E9EDEE" letter-spacing="0.1">Upstream</text><text x="58" y="190.9" font-family="'Space Grotesk','Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.2" font-weight="400" fill="#9AA5AA">HLS playlist, or a</text><text x="58" y="205.3" font-family="'Space Grotesk','Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.2" font-weight="400" fill="#9AA5AA">bare TS socket</text></g><g><rect x="40" y="252" width="264" height="82" rx="9" fill="#171D20" stroke="#2A3236" stroke-width="1"/><rect x="41.5" y="261" width="3" height="64" rx="1.5" fill="#F7B83D"/><text x="58" y="275.4" font-family="'Space Grotesk','Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.6" font-weight="600" fill="#E9EDEE" letter-spacing="0.1">follow + fetch</text><text x="58" y="292.9" font-family="'Space Grotesk','Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.2" font-weight="400" fill="#9AA5AA">poll · retry · failover</text><text x="58" y="307.3" font-family="'Space Grotesk','Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.2" font-weight="400" fill="#9AA5AA">bare TS → PAT/PMT → cut at RAI</text></g><g><rect x="40" y="354" width="264" height="82" rx="9" fill="#171D20" stroke="#2A3236" stroke-width="1"/><rect x="41.5" y="363" width="3" height="64" rx="1.5" fill="#F7B83D"/><text x="58" y="377.4" font-family="'Space Grotesk','Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.6" font-weight="600" fill="#E9EDEE" letter-spacing="0.1">decrypt AES-128</text><text x="58" y="394.9" font-family="'Space Grotesk','Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.2" font-weight="400" fill="#9AA5AA">key cached per rotation</text><text x="58" y="409.3" font-family="'Space Grotesk','Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.2" font-weight="400" fill="#9AA5AA">ciphertext never enters the ring</text></g><g><rect x="348" y="300" width="244" height="92" rx="9" fill="#13181A" stroke="#2A3236" stroke-width="1"/><rect x="349.5" y="309" width="3" height="74" rx="1.5" fill="#5FD37F"/><text x="366" y="323.4" font-family="'Space Grotesk','Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.6" font-weight="600" fill="#E9EDEE" letter-spacing="0.1">RING · RAM only</text><text x="366" y="340.9" font-family="'Space Grotesk','Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.2" font-weight="400" fill="#9AA5AA">our own seq · originRingMb</text><text x="366" y="355.3" font-family="'Space Grotesk','Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.2" font-weight="400" fill="#9AA5AA">oldest evicted · 3-seg floor</text></g><g><rect x="636" y="150" width="264" height="82" rx="9" fill="#171D20" stroke="#2A3236" stroke-width="1"/><rect x="637.5" y="159" width="3" height="64" rx="1.5" fill="#48D7FE"/><text x="654" y="173.4" font-family="'Space Grotesk','Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.6" font-weight="600" fill="#E9EDEE" letter-spacing="0.1">authored manifest</text><text x="654" y="190.9" font-family="'Space Grotesk','Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.2" font-weight="400" fill="#9AA5AA">our MEDIA-SEQUENCE / EXTINF</text><text x="654" y="205.3" font-family="'Space Grotesk','Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.2" font-weight="400" fill="#9AA5AA">no keys · no vendor tags · no hops</text></g><g><rect x="636" y="262" width="264" height="82" rx="9" fill="#171D20" stroke="#2A3236" stroke-width="1"/><rect x="637.5" y="271" width="3" height="64" rx="1.5" fill="#48D7FE"/><text x="654" y="285.4" font-family="'Space Grotesk','Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.6" font-weight="600" fill="#E9EDEE" letter-spacing="0.1">raw TS concat</text><text x="654" y="302.9" font-family="'Space Grotesk','Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.2" font-weight="400" fill="#9AA5AA">one continuous video/mp2t</text><text x="654" y="317.3" font-family="'Space Grotesk','Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.2" font-weight="400" fill="#9AA5AA">segment boundary = keyframe</text></g><g><rect x="636" y="400" width="264" height="82" rx="9" fill="#171D20" stroke="#2A3236" stroke-width="1"/><rect x="637.5" y="409" width="3" height="64" rx="1.5" fill="#9AA5AA"/><text x="654" y="423.4" font-family="'Space Grotesk','Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.6" font-weight="600" fill="#E9EDEE" letter-spacing="0.1">N viewers</text><text x="654" y="440.9" font-family="'Space Grotesk','Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.2" font-weight="400" fill="#9AA5AA">a 2nd viewer costs</text><text x="654" y="455.3" font-family="'Space Grotesk','Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.2" font-weight="400" fill="#9AA5AA">NO extra upstream</text></g><rect x="449.48" y="459.2" width="41.04" height="21.6" rx="10.8" fill="#0C0F11" stroke="#2A3236" stroke-width="1"/><text x="470" y="470.56" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.6" font-weight="400" fill="#5FD37F" text-anchor="middle">push</text><rect x="583.48" y="236.2" width="41.04" height="21.6" rx="10.8" fill="#0C0F11" stroke="#2A3236" stroke-width="1"/><text x="604" y="247.56" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.6" font-weight="400" fill="#5FD37F" text-anchor="middle">read</text><text x="32" y="545" font-family="'Space Grotesk','Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9.6" font-weight="400" fill="#5E696E">Ingress and egress are now INDEPENDENT: one ingest feeds N viewers, so ingest bytes are reported separately (kind:"iop") and never folded into egress counts.</text><text x="32" y="569" font-family="'Space Grotesk','Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9.6" font-weight="400" fill="#5E696E">Off by default — with originEnabled false the engine proxies the upstream playlist exactly as before and this whole path is skipped.</text><text x="32" y="593" font-family="'Space Grotesk','Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9.6" font-weight="400" fill="#5E696E">Discontinuity is emitted only where the upstream tags one, or a media-sequence gap proves segments were missed — never guessed from URL shape.</text><circle cx="36" cy="622" r="4" fill="#5E696E"/><text x="46" y="625" font-family="'Space Grotesk','Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9.6" font-weight="400" fill="#5E696E">Upstream</text><circle cx="114.24" cy="622" r="4" fill="#F7B83D"/><text x="124.24" y="625" font-family="'Space Grotesk','Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9.6" font-weight="400" fill="#5E696E">Side-1 · ingest (iop)</text><circle cx="261.12" cy="622" r="4" fill="#5FD37F"/><text x="271.12" y="625" font-family="'Space Grotesk','Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9.6" font-weight="400" fill="#5E696E">Ring · RAM</text><circle cx="349.92" cy="622" r="4" fill="#48D7FE"/><text x="359.92" y="625" font-family="'Space Grotesk','Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9.6" font-weight="400" fill="#5E696E">Side-2 · serve (oop)</text><circle cx="491.52" cy="622" r="4" fill="#9AA5AA"/><text x="501.52" y="625" font-family="'Space Grotesk','Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9.6" font-weight="400" fill="#5E696E">Clients</text>
</svg>
