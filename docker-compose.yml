services:
  masqueradarr:
    # SPECIFY THE IMAGE TAG TO USE ':dev' or ':latest'
    # image: iflip721/masqueradarr:latest
    image: iflip721/masqueradarr:dev
    user: "${APP_USER_ID:-1000}:${APP_GROUP_ID:-1000}"
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    environment:
      MONGO_ROOT_USER: ${MONGO_ROOT_USER}
      MONGO_ROOT_PASS: ${MONGO_ROOT_PASS}
      DISPLAY_NAME: ${DISPLAY_NAME:-masqueradarr}
      DOMAIN: ${DOMAIN:-http://localhost:3000}
      TZ: ${TZ:-America/New_York}
      DNS_LOG_LEVEL: ${DNS_LOG_LEVEL:-2}
      # EDGE-3 (opt-in): unset/empty = today's topology (Node is the public edge, Rust a loopback sidecar).
      # Set MASQ_EDGE=1 to invert — Rust binds the public :3000 and reverse-proxies to Node on a loopback
      # internal port. Same public port + no other change; fully reversible by clearing it. See .env.example.
      MASQ_EDGE: ${MASQ_EDGE:-}
      # App-wide Docker socket access (0 = off, the default; 1 = on, host-root-equivalent). The one switch for
      # every Docker-dependent feature (today: Rebel IPTV updates/restarts/logs). See .env.example.
      DOCKER_SOCK_ACCESS: ${DOCKER_SOCK_ACCESS:-0}
      # Only used when DOCKER_SOCK_ACCESS=1 — the restricted socket proxy below (never the raw socket).
      MASQ_DOCKER_HOST: tcp://docker-sock-proxy:2375
      # Rebel IPTV companion (0 = off, the default; 1 = on). The same switch sizes the rebel-iptv service below.
      REBEL_IPTV_ENABLED: ${REBEL_IPTV:-0}
      REBEL_IPTV_URL: http://rebel-iptv:8080
      REBEL_IPTV_IMAGE: ${REBEL_IPTV_IMAGE:-rebeliptv/iptv:latest}
      REBEL_IPTV_UI_PORT: ${REBEL_IPTV_UI_PORT:-3080}
      REBEL_IPTV_UI_PUBLIC_URL: ${REBEL_IPTV_UI_PUBLIC_URL:-}
    ports:
      - "${MASQUERADARR_PORT:-3000}:3000"
      # Admin-gated Rebel IPTV dashboard pop-up. Always published; nothing listens behind it while REBEL_IPTV=0.
      - "${REBEL_IPTV_UI_PORT:-3080}:3080"
    volumes:
      - ${COMPOSE_PATH:-./compose}:/app/compose:rw
      - ${BACKUPS_PATH:-./backups}:/backups:rw
    depends_on:
      mongo:
        condition: service_healthy
    networks: [masqueradarr-net, docker-sock, rebel-net]
    restart: unless-stopped

  # Rebel IPTV — optional companion service (https://github.com/rebeliptv/iptv), created ONLY when REBEL_IPTV=1
  # (scale 0 = no container). Closed-source, licensed for personal non-commercial use; it runs as its own
  # UNMODIFIED container. masqueradarr ingests its playlist + guide over the private rebel-net network and serves
  # Rebel's dashboard through the admin-gated pop-up above. Rebel publishes NO host port, never sees the Docker
  # socket, and is not on masqueradarr-net (it cannot reach MongoDB).
  # Updates: with DOCKER_SOCK_ACCESS=1 masqueradarr pulls + recreates it (Settings → Rebel IPTV); with 0,
  # force-pull by hand:  docker compose pull rebel-iptv && docker compose up -d rebel-iptv
  rebel-iptv:
    image: ${REBEL_IPTV_IMAGE:-rebeliptv/iptv:latest}
    scale: ${REBEL_IPTV:-0}
    hostname: rebel-iptv
    labels:
      io.masqueradarr.role: rebel-iptv
    environment:
      TZ: ${TZ:-America/New_York}
      # Who may set X-Forwarded-* for Rebel. Broad private ranges are safe while Rebel publishes no port;
      # narrow this to rebel-net's subnet if you ever publish 8080.
      TRUSTED_PROXIES: ${REBEL_IPTV_TRUSTED_PROXIES:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
    volumes:
      - ${REBEL_IPTV_DATA_PATH:-rebel-iptv-data}:/app/data
    networks: [rebel-net]
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped

  # Restricted Docker API proxy — created ONLY when DOCKER_SOCK_ACCESS=1 (scale 0 = no container, no socket
  # mount). Least-privilege sections for today's only consumer (Rebel IPTV): containers, images, networks.
  # It narrows which endpoints exist; it is NOT a security boundary (POST + CONTAINERS can start a privileged
  # container). A future Docker-dependent feature that needs more widens these explicitly.
  docker-sock-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    scale: ${DOCKER_SOCK_ACCESS:-0}
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      POST: 1
      EVENTS: 0
      INFO: 0
      EXEC: 0
      VOLUMES: 0
    volumes:
      - ${DOCKER_SOCK_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro
    networks: [docker-sock]
    restart: unless-stopped

  mongo:
    # If you have issues using MongoDB 7.x due to legacy hardware switch value for MongoDB 4.x or highe
    image: mongo:7.0.15
    user: "${MONGO_USER_ID:-999}:${MONGO_GROUP_ID:-999}"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS}
    ports:
      - "${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - ${MONGO_DATA_PATH:-mongo-data}:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [masqueradarr-net]
    restart: unless-stopped

volumes:
  # Fallback named volume — used only when MONGO_DATA_PATH is unset.
  mongo-data:
  # Fallback named volume for Rebel IPTV — used only when REBEL_IPTV=1 and REBEL_IPTV_DATA_PATH is unset.
  rebel-iptv-data:

networks:
  masqueradarr-net:
  # Internal-only lane between masqueradarr and the socket proxy (no outside connectivity).
  docker-sock:
    internal: true
  # Private lane between masqueradarr and Rebel IPTV (empty while REBEL_IPTV=0).
  rebel-net:
