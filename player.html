<!DOCTYPE html>
<html lang="en" data-theme="dark" data-density="regular">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- This is the window title, and in a pop-up (and in full screen) it is the ONLY branding the browser
       shows — the pop-up's chrome has no tab strip to fall back on. UplApp re-writes it per channel; keep
       this exact string as the idle/base form so both agree. -->
  <title>Ultimate Video Player : masqueradarr</title>
  <!-- Kept deliberately in step with index.html: the data-theme / data-density attributes above and the two
       font families below are where the --mq-font-* stack actually comes from, and this entry does not mount
       the SPA shell that would otherwise supply them. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    /* This window is chrome-free: no sidebar, no topbar, no .screen padding. The player owns the viewport,
       so lock scrolling here rather than fighting the SPA's global layout rules. */
    html, body { height: 100%; overflow: hidden; }
    #upl { height: 100%; }
  </style>
</head>
<body>
  <div id="upl"></div>
  <script type="module" src="/src/upl/main.ts"></script>
</body>
</html>
